tags:
- Hiring
- Recruiting
- HR Tech
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Fountain spend. Fountain is an enterprise SaaS platform billed
  as a sales-quoted subscription (typically annual) across the Hire, Onboard,
  and Workforce Management suites, generally scaled by seats, hiring volume,
  and enabled modules. It is not a usage-metered, pay-per-call API product, so
  cost management centers on subscription allocation, seat utilization, and
  hiring-volume forecasting rather than per-request metering.
notes: >-
  Fountain does not expose public usage-based API pricing or billing exports
  documented in its developer reference. Cost dimensions below are modeled
  from the subscription/seat/volume model; reconcile against the customer's
  Fountain order form and invoices.
sources:
- https://www.fountain.com/pricing
- https://developer.fountain.com/reference
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Fountain
serviceCategory: Human Resources
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Fountain
  ServiceCategory: Human Resources
  ProviderName: Fountain
  PublisherName: Fountain
  InvoiceIssuerName: Fountain
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: seats
  description: Recruiter / hiring-manager seats licensed under the subscription.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - suite
- name: hiring_volume
  description: Applicants processed / workers hired, a common subscription scaling dimension.
  unit: applicants
  aggregation: sum
  dimensions:
  - account
  - opening
  - position
- name: suite_modules
  description: Enabled product suites/modules (Hire, Onboard, Workforce Management).
  unit: modules
  aggregation: max
  dimensions:
  - account
  - suite
- name: api_requests
  description: Developer API calls; not separately metered/billed but useful for internal cost allocation and rate management.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - api
principles:
- name: Visibility
  description: Track seat utilization and hiring volume against the contracted subscription; monitor API call patterns per integration.
- name: Allocation
  description: Map Fountain subscription cost to hiring teams, brands, and regions by opening/position/location.
- name: Optimization
  description: Right-size seats, consolidate openings, and use webhooks + bulk endpoints to reduce integration overhead.
- name: Accountability
  description: Assign owners per suite/module; review seat and volume utilization each renewal cycle against spend.
maintainers:
- FN: Kin Lane
