aid: fountain-com
url: https://raw.githubusercontent.com/api-evangelist/fountain-com/refs/heads/main/apis.yml
name: Fountain
kind: company
description: Fountain is a high-volume, frontline hourly hiring and workforce
  management platform used by enterprises to source, screen, schedule, and hire
  large numbers of hourly workers. The Fountain Developer API (Hire API v2) lets
  customers programmatically manage applicants, openings, positions, stages,
  labels, documents, scheduling slots, and webhooks across their hiring funnels.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Hiring
- Recruiting
- Applicant Tracking
- Frontline Hiring
- Hourly Workforce
- HR Tech
- Onboarding
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
